[package]
name = "opencode-acp-bridge"
version = "0.8.6"
edition = "2024"
description = "ACP (Agent Client Protocol) server bridging to a shared opencode server over its HTTP API"
license = "MIT"

[dependencies]
# ACP protocol — pinned to the exact version the user's Zed checkout uses,
# so the bridge speaks a byte-identical dialect (v1 + unstable extensions).
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# opencode HTTP API client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2"] }
eventsource-stream = "0.2"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors & logging (stdout is reserved for JSON-RPC; logs go to stderr)
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
